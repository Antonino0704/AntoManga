name: Black and Prettier Format, Lint 
on: [pull_request]

jobs:
  formatCheck:
    name: Black and Prettier Format, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Black Check
        uses: psf/black@26.10.1
        with:
          options: "--check --diff"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: Type Check
        run: npm run type-check
        working-directory: ./src/frontend

      - name: Format Check
        run: npm run format-check
        working-directory: ./src/frontend

      - name: Lint
        run: npm run lint
        working-directory: ./src/frontend
