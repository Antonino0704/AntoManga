name: Django Tests
on: 
  pull_request:
    paths:
      - src/**
      - "!src/frontend/**"

jobs:
    testCheck:
        name: Test Check
        runs-on: ubuntu-latest

        services:
          mysql:
            image: mysql:8.4
            env:
              MYSQL_ROOT_PASSWORD: root
              MYSQL_DATABASE: antomanga_test_db
              MYSQL_USER: admin
              MYSQL_PASSWORD: admin
            ports:
              - 3306:3306
            options: >-
              --health-cmd="mysqladmin ping -h localhost"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=5
            
        steps:
        - name: Checkout Project
          uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: "3.15"
            cache: "pip"
        
        - name: Install dependencies
          run: pip install -r ./requirements.txt
        
        - name: Generate .env file
          run: python ./src/core/setup.py
        
        - name: Create my.cnf for CI
          run: |
            cat > ./src/my.cnf <<EOF
            [client]
            database = antomanga_test_db
            user = admin
            password = admin
            host = 127.0.0.1
            port = 3306
            default-character-set = utf8mb4
            EOF

        - name: Run Tests
          working-directory: src
          run: python manage.py test