services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ../src/db:/app/db
      - ../src/static:/app/static
  
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../src/static:/app/static:ro
    depends_on:
      - web