name: AntoManga-Stack

services:
  db:
    container_name: AntoManga-db
    image: mariadb:11.4
    restart: unless-stopped
    env_file: mariadb.env
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    container_name: AntoManga-web
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: antomanga:1.0
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ../src/my.cnf:/app/my.cnf:ro
      - ../src/static:/app/static
      - ../src/media:/app/media
    depends_on:
      db:
        condition: service_healthy
  
  nginx:
    container_name: AntoManga-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../src/static:/app/static:ro
      - ../src/media:/app/media:ro
    depends_on:
      - web

volumes:
  mariadb_data: